<!doctype html>
<html lang="tr" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sunucu Paneli</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/tailwind.css">
  <link rel="stylesheet" href="/vendor/xterm/css/xterm.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="h-full bg-slate-950 text-slate-200">
  <!-- Mobil üst çubuk -->
  <header class="md:hidden sticky top-0 z-30 flex items-center justify-between border-b border-slate-800 bg-slate-950/95 px-4 py-3 backdrop-blur">
    <button id="menu-btn" class="rounded-lg p-1.5 text-slate-300 hover:bg-slate-800" aria-label="Menü">
      <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <span class="font-semibold" data-hostname>Sunucu Paneli</span>
    <span class="conn-dot h-2.5 w-2.5 rounded-full bg-slate-600" title="Bağlantı"></span>
  </header>

  <div id="backdrop" class="fixed inset-0 z-30 hidden bg-black/60 md:hidden"></div>

  <!-- Kenar menü -->
  <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-60 -translate-x-full border-r border-slate-800 bg-slate-900 transition-transform md:translate-x-0">
    <div class="flex h-full flex-col">
      <div class="flex items-center gap-3 px-5 py-5 border-b border-slate-800">
        <div class="flex h-9 w-9 items-center justify-center rounded-lg bg-emerald-500/10 text-emerald-400">
          <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/><path d="M7 7.5h.01M7 16.5h.01"/></svg>
        </div>
        <div class="min-w-0">
          <div class="truncate font-semibold" data-hostname>Sunucu Paneli</div>
          <div class="flex items-center gap-1.5 text-xs text-slate-400">
            <span class="conn-dot h-2 w-2 rounded-full bg-slate-600"></span><span id="conn-text">Bağlanıyor…</span>
          </div>
        </div>
      </div>
      <nav id="nav" class="flex-1 space-y-1 overflow-y-auto p-3 text-sm">
        <a href="#dashboard" data-page="dashboard" class="nav-link">Dashboard</a>
        <a href="#pm2" data-page="pm2" class="nav-link">PM2</a>
        <a href="#terminal" data-page="terminal" class="nav-link">Terminal</a>
        <a href="#files" data-page="files" class="nav-link">Dosyalar</a>
        <a href="#system" data-page="system" class="nav-link">Süreçler ve servisler</a>
        <a href="#alerts" data-page="alerts" class="nav-link">Uyarılar</a>
        <a href="#audit" data-page="audit" class="nav-link">Audit kaydı</a>
      </nav>
      <div class="border-t border-slate-800 p-3">
        <div class="flex items-center justify-between rounded-lg px-3 py-2 text-sm">
          <span class="truncate text-slate-400" id="current-user"></span>
          <button id="logout-btn" class="rounded-md px-2 py-1 text-slate-300 hover:bg-slate-800">Çıkış</button>
        </div>
      </div>
    </div>
  </aside>

  <main class="md:pl-60">
    <div id="page" class="mx-auto max-w-7xl p-4 md:p-6"></div>
  </main>

  <!-- Bildirimler -->
  <div id="toasts" class="fixed bottom-4 right-4 z-50 flex w-80 max-w-[calc(100vw-2rem)] flex-col gap-2"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/vendor/chart.js/chart.umd.js"></script>
  <script src="/vendor/xterm/lib/xterm.js"></script>
  <script src="/vendor/xterm-fit/addon-fit.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/dashboard.js"></script>
  <script src="/js/pm2.js"></script>
  <script src="/js/terminal.js"></script>
  <script src="/js/files.js"></script>
  <script src="/js/system.js"></script>
  <script src="/js/alerts.js"></script>
  <script src="/js/audit.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
